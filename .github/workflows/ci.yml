name: "CI"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: "build-${{ github.head_ref || github.run_id }}-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
            dotnet-version: '10.0.x'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: dotnet build -c Release

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.event.head_commit.message, '[Deploy]') && github.event_name == 'push'
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
      - name: Install native depedencies
        run: sudo apt-get install -y libimage-exiftool-perl

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
            dotnet-version: '10.0.x'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish
        run: dotnet publish -o publish /nowarn:NETSDK1194

      - name: Get Project File Name
        id: find_file
        shell: bash
        run: |
          FILE_PATH=$(find . -maxdepth 3 -name "*.csproj" -print -quit)
          FILE_NAME=$(basename "$FILE_PATH")
          FILE_NAME_NO_EXT="${FILE_NAME%.*}"

          echo "Found project name: $FILE_NAME_NO_EXT"

          echo "filename=$FILE_NAME_NO_EXT" >> "$GITHUB_OUTPUT"

      - name: Extract SemVer from Output
        id: get_version
        shell: bash
        run: |
          SEMVER=$(exiftool -s -s -s -AssemblyVersion ./publish/${{ steps.find_file.outputs.filename }}.dll | cut -d'.' -f1-3)

          echo "Extracted SemVer: $SEMVER"

          echo "version=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Attest
        uses: actions/attest@v4.2.2
        with:
          subject-path: 'publish/${{ steps.find_file.outputs.filename }}.dll'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{  steps.get_version.outputs.version }}
          name: ${{ steps.find_file.outputs.filename }} v${{  steps.get_version.outputs.version }}
          files: |
            ./publish/${{ steps.find_file.outputs.filename }}.dll
          body_path: CHANGELOG.md
          target_commitish: ${{ github.event.head_commit.id }}
          make_latest: true
